services:
  backend:
    build: .
    container_name: gooddrinks-backend
    ports:
      - "5003:5003"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/gooddrinks
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    container_name: gooddrinks-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: