<div class="container">
    <h2>Register</h2>
    <form id="register-form">
        <div>
            <label for="reg-username">Nombre:</label>
            <input type="text" id="reg-username" required autocomplete="username">
        </div>
        <div>
            <label for="reg-email">Email:</label>
            <input type="text" id="reg-email" required autocomplete="email">
        </div>
        <div>
            <label for="reg-password">Password:</label>
            <input type="password" id="reg-password" required autocomplete="new-password">
        </div>
        <button type="submit">Registrarse</button>
    </form>
    <p>Already have an account? <a href="#" onclick="loadLogin()">Login here</a></p>
</div>
