<div class="container">
    <h2>Login</h2>
    <form id="login-form">
        <div>
            <label for="email">Email:</label>
            <input type="text" id="email" required required autocomplete="email">
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="#" onclick="loadRegister()">Register here</a></p>
</div>
